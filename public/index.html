<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SanoVet — Gestión para clínicas veterinarias</title>
  <meta name="description" content="SanoVet: sistema para clínicas veterinarias de Latinoamérica. Historia clínica de cada mascota con signos vitales, diagnóstico y récipe; vacunas y desparasitación con carnet digital y QR; agenda por veterinario y peluquero con sala de espera; peluquería y hospitalización; recordatorios de vacunas por WhatsApp; tienda con alimento a granel, lotes y vencimientos, pedidos en línea, compras, caja en dos monedas y reportes. Funciona en el teléfono y en la computadora, también sin internet.">
  <meta name="theme-color" content="#1e1036">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SanoVet">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sv_theme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-inner">
      <img src="/assets/icon-192.png" alt="SanoVet">
      <div class="spinner"></div>
    </div>
  </div>
  <div id="root"></div>
  <div id="modals"></div>
  <div id="toasts" class="toasts"></div>
  <noscript>SanoVet necesita JavaScript habilitado.</noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
